<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='8' fill='%230d0120'/%3E%3Cpath transform='translate(11.1 4.6)' fill='%23d2aeff' d='M4.937 10.524L4.935 11.206H7.917C8.515 11.206 9 11.68 9 12.264V14.225C9 14.809 8.515 15.283 7.917 15.283H4.935V21.776C4.935 22.36 4.45 22.834 3.852 22.834H1.084C.485 22.834 0 22.36 0 21.776V10.464H.002C.03 5.098 3.734.664 8.503.01 9.149-.078 9.723.425 9.723 1.062V3.955C9.723 4.458 9.359 4.881 8.856 4.989 6.63 5.47 4.937 7.769 4.937 10.524Z'/%3E%3C/svg%3E">

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

<script type="application/ld+json">{{JSONLD}}</script>
<style>
  /* Fever web tokens (feverup.com) + Black Friday 2026 palette (Fever BF26 creatives) */
  :root{
    --bg:#0d0120; --surface:#1a0d30; --surface-2:#251542; --line:#36265c;
    --text:#fff; --muted:#b9adcf;
    --lilac:#d2aeff; --green:#51da94; --blue:#67cbff; --yellow:#ffd779; --red:#ed565b;
    --ink:#000; --focus:#0089e3;
    --pill:64px; --card:12px;
    --font:Montserrat,-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;
  }
  *{box-sizing:border-box}
  [hidden]{display:none!important}
  html{-webkit-text-size-adjust:100%}
  body{margin:0;background:var(--bg);color:var(--text);font-family:var(--font);-webkit-font-smoothing:antialiased}
  a{color:inherit}
  .container{max-width:960px;margin:0 auto;padding:0 16px}
  :focus-visible{outline:2px solid var(--lilac);outline-offset:2px}

  /* Hero: poster image is static (prerendered, LCP); the video is added by JS on top */
  .hero{position:relative}
  .media{position:relative;overflow:hidden;aspect-ratio:1/1;background:var(--bg)}
  .media img,.media video{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;
    object-position:center 25%}
  .media video{opacity:0;transition:opacity .4s}
  .media video.on{opacity:1}
  .media::after{content:"";position:absolute;inset:auto 0 0;height:30%;z-index:2;
    background:linear-gradient(transparent,var(--bg))}
  @media (min-width:768px){
    .media{aspect-ratio:auto;height:clamp(320px,38vw,480px)}
    .media img,.media video{object-position:center}
  }
  .hero-body{position:relative;z-index:2;margin-top:-28px;padding-bottom:8px}
  .eyebrow{display:inline-block;margin:0 0 12px;padding:6px 12px;border-radius:6px;background:var(--lilac);
    color:var(--ink);font-size:12px;font-weight:800;letter-spacing:.08em;text-transform:uppercase}
  h1{margin:0;font-weight:900;font-size:clamp(34px,9vw,56px);line-height:1;letter-spacing:-.02em}
  .lead{margin:12px 0 0;max-width:520px;color:var(--muted);font-size:16px;line-height:1.5;font-weight:500}
  .suggest{display:none;margin-top:20px}
  .suggest small{display:block;margin-bottom:8px;color:var(--muted);font-size:12px;font-weight:600}
  .suggest a{display:inline-flex;align-items:center;gap:10px;padding:14px 20px;border-radius:var(--pill);
    background:var(--lilac);color:var(--ink);text-decoration:none;font-weight:800;font-size:15px;
    transition:transform .1s,filter .15s}
  .suggest a:hover{filter:brightness(1.06)}
  .suggest a:active{transform:scale(.98)}
  .suggest a[hidden]+.locate{margin-left:0}
  .locate{display:inline-flex;align-items:center;gap:6px;margin:10px 0 0 4px;padding:8px 4px;border:0;
    background:none;color:var(--muted);font:600 13px/1 var(--font);cursor:pointer;vertical-align:middle}
  .locate:hover{color:var(--text)}
  .locate[disabled]{cursor:default;opacity:.7}
  @media (min-width:480px){.locate{margin:0 0 0 12px}}

  /* Search + filters */
  .tools{position:sticky;top:0;z-index:10;background:var(--bg);padding:16px 0 8px;
    border-bottom:1px solid transparent;transition:border-color .2s}
  .tools.stuck{border-bottom-color:var(--line)}
  .field{position:relative;display:block}
  .field svg{position:absolute;left:18px;top:50%;transform:translateY(-50%);color:#536b75;pointer-events:none}
  .field input{width:100%;height:52px;padding:0 48px;font:600 16px/1 var(--font);color:#031419;
    background:#fff;border:2px solid transparent;border-radius:var(--pill);outline:none;
    -webkit-appearance:none;appearance:none}
  .field input::placeholder{color:#7d8f98;font-weight:500}
  .field input:focus{border-color:var(--lilac)}
  .field input::-webkit-search-cancel-button{display:none}
  .clear{position:absolute;right:8px;top:50%;transform:translateY(-50%);display:none;width:36px;height:36px;
    border:0;border-radius:50%;background:#f2f3f3;color:#031419;cursor:pointer;font-size:18px;line-height:1}
  .chips{display:flex;gap:8px;overflow-x:auto;margin:12px -16px 0;padding:0 16px 8px;
    scrollbar-width:none;-webkit-overflow-scrolling:touch}
  .chips::-webkit-scrollbar{display:none}
  .chip{flex:0 0 auto;height:36px;padding:0 16px;border-radius:var(--pill);border:1px solid var(--line);
    background:var(--surface);color:var(--text);font:600 14px/1 var(--font);cursor:pointer;white-space:nowrap;
    transition:background .15s,border-color .15s,color .15s}
  .chip:hover{border-color:var(--lilac)}
  .chip[aria-pressed="true"]{background:var(--lilac);border-color:var(--lilac);color:var(--ink)}
  .no-js .chips,.no-js .clear{display:none}

  /* City list */
  main{padding-bottom:16px}
  section{margin-top:28px}
  h2{margin:0 0 12px;font-size:20px;font-weight:800;letter-spacing:-.01em}
  .grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:8px;margin:0;padding:0;list-style:none}
  @media (min-width:600px){.grid{grid-template-columns:repeat(3,minmax(0,1fr))}}
  @media (min-width:860px){.grid{grid-template-columns:repeat(4,minmax(0,1fr))}}
  .city{display:flex;align-items:center;justify-content:space-between;gap:8px;min-height:60px;height:100%;
    padding:10px 12px 10px 16px;background:var(--surface);border:1px solid var(--line);border-radius:var(--card);
    text-decoration:none;transition:background .15s,border-color .15s,transform .1s}
  .city:hover{background:var(--surface-2);border-color:var(--lilac)}
  .city:active{transform:scale(.98)}
  .city .txt{min-width:0}
  .city .name{display:block;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;font-weight:700;font-size:15px}
  .city .local{display:block;margin-top:2px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;
    color:var(--muted);font-size:12px;font-weight:500}
  .city .go{flex:0 0 auto;display:grid;place-items:center;width:28px;height:28px;border-radius:50%;
    background:var(--accent,var(--lilac));color:var(--ink)}
  .empty{display:none;padding:48px 0 24px;text-align:center}
  .empty p{margin:0 0 16px;color:var(--muted);font-weight:500}
  .btn{display:inline-flex;align-items:center;height:48px;padding:0 24px;border-radius:var(--pill);
    background:#fff;color:var(--ink);text-decoration:none;font-weight:800;font-size:15px}

  footer{margin-top:40px;padding:28px 0 calc(28px + env(safe-area-inset-bottom));border-top:1px solid var(--line);
    color:var(--muted);font-size:13px;font-weight:500}
  footer .container{display:flex;flex-wrap:wrap;align-items:center;justify-content:space-between;gap:12px}
  footer a{color:var(--text);font-weight:700;text-decoration:none}
  footer a:hover{text-decoration:underline}
  @media (prefers-reduced-motion:reduce){*{transition:none!important}}
</style>
</head>
<body class="no-js">
<header class="hero">
  <div class="media" id="media" data-video-mobile="{{VIDEO_MOBILE}}" data-video-desktop="{{VIDEO_DESKTOP}}">
    <picture>
      <source media="(min-width: 768px)" srcset="{{POSTER_DESKTOP}}">
      <img src="{{POSTER_MOBILE}}" alt="Black Friday on Fever" width="720" height="1280" fetchpriority="high">
    </picture>
  </div>
  <div class="hero-body container">
    <p class="eyebrow">Black Friday 2026</p>
    <h1>Choose your city</h1>
    <p class="lead">Join the Black Friday waitlist in your city and get early access to the best deals on experiences, concerts and shows.</p>
    <div class="suggest" id="suggest">
      <small id="suggestLabel">Near you</small>
      <a id="suggestLink" href="#"></a>
      <button class="locate" id="locate" type="button">
        <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" aria-hidden="true"><circle cx="12" cy="12" r="3"/><path d="M12 2v3M12 19v3M2 12h3M19 12h3"/><circle cx="12" cy="12" r="7"/></svg>
        <span id="locateText">Use my location</span>
      </button>
    </div>
  </div>
</header>

<div class="tools" id="tools">
  <div class="container">
    <label class="field">
      <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" aria-hidden="true"><circle cx="11" cy="11" r="7"/><path d="m20 20-3.5-3.5"/></svg>
      <input id="q" type="search" placeholder="Search your city" autocomplete="off" enterkeyhint="go" aria-label="Search your city">
      <button class="clear" id="clear" type="button" aria-label="Clear search">&times;</button>
    </label>
    <div class="chips" id="chips" role="toolbar" aria-label="Filter by region">
{{CHIPS}}
    </div>
  </div>
</div>

<main class="container" id="list">
{{CITIES}}
  <div class="empty" id="empty">
    <p>We couldn't find that city.</p>
    <a class="btn" href="https://feverup.com/">Explore Fever</a>
  </div>
</main>

<footer>
  <div class="container">
    <span>&copy; 2026 Fever &middot; {{COUNT}} cities</span>
    <a href="https://feverup.com/">feverup.com</a>
  </div>
</footer>

<script>
document.body.classList.remove("no-js");
const $ = id => document.getElementById(id);
const norm = s => s.normalize("NFD").replace(/[\u0300-\u036f]/g, "").toLowerCase().trim();
const cities = [...document.querySelectorAll(".city")];
const sections = [...document.querySelectorAll("#list section")];

// utm_source / utm_medium / utm_term on this page's URL override the defaults baked into every link
// (e.g. https://feverseasonals.com/?utm_source=instagram). utm_campaign and utm_content are never overridden.
const incoming = new URLSearchParams(location.search);
const override = ["utm_source", "utm_medium", "utm_term"].filter(k => incoming.get(k));
if (override.length) cities.forEach(a => {
  const u = new URL(a.href);
  override.forEach(k => u.searchParams.set(k, incoming.get(k)));
  a.href = u;
});

// Search + region filter
const q = $("q"), clear = $("clear"), empty = $("empty");
let region = "All";
function apply() {
  const term = norm(q.value);
  clear.style.display = term ? "block" : "none";
  let total = 0;
  sections.forEach(sec => {
    // A search looks across all regions
    const regionOk = term || region === "All" || sec.dataset.region === region;
    let n = 0;
    sec.querySelectorAll("li").forEach(li => {
      const show = regionOk && (!term || li.firstElementChild.dataset.k.includes(term));
      li.hidden = !show;
      if (show) n++;
    });
    sec.hidden = !n;
    total += n;
  });
  empty.style.display = total ? "none" : "block";
}
cities.forEach(a => { a.dataset.k = norm(a.textContent.replace(/\s+/g, " ")); });
q.addEventListener("input", apply);
q.addEventListener("keydown", e => {
  // Enter jumps to the first match
  if (e.key !== "Enter" || !q.value.trim()) return;
  const first = cities.find(a => !a.closest("li").hidden && !a.closest("section").hidden);
  if (first) location.href = first.href;
});
clear.onclick = () => { q.value = ""; apply(); q.focus(); };
$("chips").addEventListener("click", e => {
  const b = e.target.closest(".chip");
  if (!b) return;
  region = b.dataset.region;
  $("chips").querySelectorAll(".chip").forEach(c => c.setAttribute("aria-pressed", c === b));
  apply();
});

// "Near you": the device location when the user allows it (nothing leaves the browser);
// until then, a guess from time zone + browser language.
const suggestLink = $("suggestLink"), locate = $("locate"), locateText = $("locateText");
function showSuggestion(city, label) {
  suggestLink.hidden = !city;
  if (city) {
    suggestLink.href = city.href;
    suggestLink.innerHTML = `<span></span>${city.querySelector(".go").innerHTML}`;
    suggestLink.firstChild.textContent = `See deals in ${city.querySelector(".name").textContent}`;
  }
  $("suggestLabel").textContent = label;
  $("suggest").style.display = "block";
}

const offsetOf = zone => {
  try { return new Intl.DateTimeFormat("en", { timeZone: zone, timeZoneName: "longOffset" }).formatToParts().find(p => p.type === "timeZoneName").value; }
  catch (e) { return null; }
};
function guessCity() {
  const tz = Intl.DateTimeFormat().resolvedOptions().timeZone;
  const tzHit = cities.find(a => (a.dataset.tz || "").split(" ").includes(tz));
  // A browser language with a country (es-ES) wins when that country shares the device's UTC offset:
  // Windows reports Spain as Europe/Paris, but es-ES + UTC+1 still means Spain.
  const here = offsetOf(tz);
  const countries = (navigator.languages || [navigator.language]).map(l => (l.split("-")[1] || "").toUpperCase()).filter(Boolean);
  for (const cc of countries) {
    if (tzHit && tzHit.dataset.country === cc) return tzHit;
    const same = cities.filter(a => a.dataset.country === cc && offsetOf(a.dataset.zone) === here);
    if (same.length) return same.find(a => a.dataset.tz) || same[0];
  }
  return tzHit;
}

const MAX_KM = 150;
function nearest(lat, lon) {
  const rad = d => d * Math.PI / 180;
  let best = null, bestKm = Infinity;
  for (const a of cities) {
    if (!a.dataset.lat) continue;
    const dLat = rad(a.dataset.lat - lat), dLon = rad(a.dataset.lon - lon);
    const h = Math.sin(dLat / 2) ** 2 + Math.cos(rad(lat)) * Math.cos(rad(+a.dataset.lat)) * Math.sin(dLon / 2) ** 2;
    const km = 12742 * Math.asin(Math.sqrt(h));
    if (km < bestKm) { best = a; bestKm = km; }
  }
  return bestKm <= MAX_KM ? best : null;
}
function useLocation() {
  if (!navigator.geolocation) { locate.hidden = true; return; }
  locate.disabled = true;
  locateText.textContent = "Finding you…";
  navigator.geolocation.getCurrentPosition(pos => {
    const city = nearest(pos.coords.latitude, pos.coords.longitude);
    locate.hidden = true;
    if (city) showSuggestion(city, "Closest to you");
    else showSuggestion(null, "No Black Friday city near you yet. Pick one below.");
  }, () => {
    locate.disabled = false;
    locateText.textContent = "Location unavailable. Try again";
  }, { maximumAge: 600000, timeout: 10000 });
}

try {
  showSuggestion(guessCity() || null, "Near you");
  if (!suggestLink.href || suggestLink.hidden) $("suggestLabel").textContent = "Find your city";
} catch (e) {}
locate.onclick = useLocation;
// Already allowed before: use it straight away, without asking again
if (navigator.permissions) navigator.permissions.query({ name: "geolocation" })
  .then(p => { if (p.state === "granted") useLocation(); }).catch(() => {});

// Hero video: skipped for reduced motion and data saver; the poster image stays otherwise
const media = $("media");
const noMotion = matchMedia("(prefers-reduced-motion: reduce)").matches;
const saveData = navigator.connection && navigator.connection.saveData;
if (!noMotion && !saveData) {
  const v = document.createElement("video");
  v.muted = v.loop = v.playsInline = v.autoplay = true;
  v.setAttribute("playsinline", "");
  v.setAttribute("aria-hidden", "true");
  v.src = matchMedia("(min-width: 768px)").matches ? media.dataset.videoDesktop : media.dataset.videoMobile;
  v.addEventListener("playing", () => v.classList.add("on"), { once: true });
  media.appendChild(v);
}

// Divider under the sticky search once it's stuck
const tools = $("tools");
new IntersectionObserver(([e]) => tools.classList.toggle("stuck", e.intersectionRatio < 1),
  { threshold: [1], rootMargin: "-1px 0px 0px 0px" }).observe(tools);
</script>
</body>
</html>
