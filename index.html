<style>
  /* Fever web tokens (feverup.com) */
  :root{
    --ink:#031419; --ink-2:#536b75; --ink-3:#a7b2ba;
    --line:#ccd2d8; --soft:#f2f3f3; --white:#fff;
    --night:#000405; --navy:#06232c;
    --blue:#0079ca; --blue-hover:#005795; --focus:#0089e3;
    --deal:#eb0052;
    --pill:64px; --card:12px;
    --font:Montserrat,-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;
  }
  *{box-sizing:border-box}
  html{-webkit-text-size-adjust:100%}
  body{margin:0;background:var(--white);color:var(--ink);font-family:var(--font);
    -webkit-font-smoothing:antialiased}
  a{color:inherit}
  .container{max-width:960px;margin:0 auto;padding:0 16px}

  /* Hero */
  .hero{position:relative;overflow:hidden;background:var(--night);color:var(--white);
    padding:20px 0 34px}
  .hero::before{content:"";position:absolute;top:-240px;right:max(-160px,calc(50% - 640px));width:560px;height:560px;
    background:radial-gradient(closest-side,rgba(0,121,202,.55),transparent);pointer-events:none}
  .hero::after{content:"";position:absolute;inset:auto auto -55% -25%;width:460px;height:460px;
    background:radial-gradient(closest-side,rgba(235,0,82,.35),transparent);pointer-events:none}
  .hero .container{position:relative;z-index:1}
  .logo{display:inline-flex;width:79px;height:24px}
  .logo svg{width:100%;height:100%}
  .hero-body{padding-top:36px}
  .eyebrow{display:inline-flex;align-items:center;gap:8px;margin:0 0 14px;padding:6px 12px;
    border:1px solid rgba(255,255,255,.22);border-radius:var(--pill);font-size:12px;font-weight:700;
    letter-spacing:.08em;text-transform:uppercase}
  .eyebrow i{width:8px;height:8px;border-radius:50%;background:var(--deal);
    box-shadow:0 0 0 4px rgba(235,0,82,.25)}
  h1{margin:0;font-weight:900;font-size:clamp(40px,11vw,76px);line-height:.95;letter-spacing:-.02em;
    text-transform:uppercase}
  h1 span{display:block;width:fit-content;background:linear-gradient(90deg,#39a5ee,#8e69e3 50%,#f43d7a);
    -webkit-background-clip:text;background-clip:text;color:transparent}
  .lead{margin:16px 0 0;max-width:460px;color:rgba(255,255,255,.78);font-size:16px;line-height:1.5;
    font-weight:500}

  /* Suggested city */
  .suggest{display:none;margin-top:22px}
  .suggest a{display:inline-flex;align-items:center;gap:10px;padding:14px 20px;border-radius:var(--pill);
    background:var(--white);color:var(--ink);text-decoration:none;font-weight:700;font-size:15px;
    transition:transform .1s,background .15s}
  .suggest a:hover{background:var(--soft)}
  .suggest a:active{transform:scale(.98)}
  .suggest small{display:block;margin-bottom:8px;color:rgba(255,255,255,.6);font-size:12px;font-weight:600}

  /* Search + filters */
  .tools{position:sticky;top:0;z-index:10;background:var(--white);padding:16px 0 8px;
    border-bottom:1px solid transparent;transition:border-color .2s}
  .tools.stuck{border-bottom-color:var(--soft)}
  .field{position:relative;display:block}
  .field svg{position:absolute;left:18px;top:50%;transform:translateY(-50%);color:var(--ink-2);
    pointer-events:none}
  .field input{width:100%;height:52px;padding:0 48px;font:600 16px/1 var(--font);color:var(--ink);
    background:var(--white);border:1px solid var(--line);border-radius:var(--pill);outline:none;
    -webkit-appearance:none;appearance:none}
  .field input::placeholder{color:var(--ink-3);font-weight:500}
  .field input:focus{border-color:var(--focus);box-shadow:0 0 0 3px rgba(0,137,227,.18)}
  .field input::-webkit-search-cancel-button{display:none}
  .clear{position:absolute;right:8px;top:50%;transform:translateY(-50%);display:none;width:36px;
    height:36px;border:0;border-radius:50%;background:var(--soft);color:var(--ink);cursor:pointer;
    font-size:18px;line-height:1}
  .chips{display:flex;gap:8px;overflow-x:auto;margin:12px -16px 0;padding:0 16px 8px;
    scrollbar-width:none;-webkit-overflow-scrolling:touch}
  .chips::-webkit-scrollbar{display:none}
  .chip{flex:0 0 auto;height:36px;padding:0 16px;border-radius:var(--pill);border:1px solid var(--line);
    background:var(--white);color:var(--ink);font:600 14px/1 var(--font);cursor:pointer;
    white-space:nowrap;transition:background .15s,border-color .15s,color .15s}
  .chip:hover{border-color:var(--ink)}
  .chip[aria-pressed="true"]{background:var(--ink);border-color:var(--ink);color:var(--white)}
  :focus-visible{outline:2px solid var(--focus);outline-offset:2px}

  /* City list */
  main{padding-bottom:16px}
  section{margin-top:28px}
  h2{margin:0 0 12px;font-size:20px;font-weight:700;letter-spacing:-.01em}
  h2 small{margin-left:6px;color:var(--ink-3);font-size:14px;font-weight:600}
  .grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:8px}
  @media (min-width:600px){.grid{grid-template-columns:repeat(3,minmax(0,1fr))}}
  @media (min-width:860px){.grid{grid-template-columns:repeat(4,minmax(0,1fr))}}
  .city{display:flex;align-items:center;justify-content:space-between;gap:8px;min-height:56px;
    padding:12px 14px 12px 16px;background:var(--soft);border:1px solid transparent;
    border-radius:var(--card);text-decoration:none;font-weight:600;font-size:15px;
    transition:background .15s,border-color .15s,transform .1s}
  .city:hover{background:var(--white);border-color:var(--ink)}
  .city:active{transform:scale(.98)}
  .city .name{min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  .city .go{flex:0 0 auto;display:grid;place-items:center;width:28px;height:28px;border-radius:50%;
    background:var(--ink);color:var(--white);transition:background .15s}
  .city:hover .go{background:var(--blue)}
  .empty{display:none;padding:48px 0 24px;text-align:center}
  .empty p{margin:0 0 16px;color:var(--ink-2);font-weight:500}
  .btn{display:inline-flex;align-items:center;height:48px;padding:0 24px;border-radius:var(--pill);
    background:var(--night);color:var(--white);text-decoration:none;font-weight:700;font-size:15px}
  .btn:hover{background:var(--navy)}

  footer{margin-top:40px;padding:28px 0 calc(28px + env(safe-area-inset-bottom));
    background:var(--navy);color:rgba(255,255,255,.7);font-size:13px;font-weight:500}
  footer .container{display:flex;flex-wrap:wrap;align-items:center;justify-content:space-between;gap:12px}
  footer a{color:var(--white);font-weight:600;text-decoration:none}
  footer a:hover{text-decoration:underline}
  @media (prefers-reduced-motion:reduce){*{transition:none!important}}
</style>
</head>
<body>
<header class="hero">
  <div class="container">
    <a class="logo" href="https://feverup.com/" aria-label="Fever">
      <svg viewBox="0 0 79 24" aria-hidden="true"><path fill="#fff" fill-rule="evenodd" clip-rule="evenodd" d="M4.93736 10.5236L4.93538 11.2057H7.91674C8.51509 11.2057 9.00043 11.6796 9.00043 12.2638V14.225C9.00043 14.8092 8.51509 15.283 7.91674 15.283H4.93538V21.7759C4.93538 22.3603 4.45005 22.8339 3.85169 22.8339H1.08369C0.485055 22.8339 0 22.3603 0 21.7759V10.4644H0.00197291C0.0295937 5.09818 3.73388 0.663695 8.50325 0.0101492C9.14924 -0.0784579 9.72308 0.424841 9.72308 1.06188V3.95537C9.72308 4.45784 9.35865 4.88079 8.85641 4.98921C6.62983 5.47022 4.93736 7.76877 4.93736 10.5236ZM69.2793 13.8122H69.2769V21.7787C69.2769 22.3671 69.7823 22.8444 70.4057 22.8444H73.2641C73.8966 22.8444 74.4055 22.3536 74.3926 21.7566L74.2189 13.8122H74.2183C74.2588 11.287 75.9121 9.18756 78.0893 8.72277C78.6152 8.61052 79 8.18758 79 7.67845V5.10977C79 4.46344 78.3945 3.9593 77.7171 4.05076C72.9897 4.69071 69.3248 8.81728 69.2793 13.8122ZM62.1984 11.9798C62.0431 10.3787 60.5287 8.81456 58.4706 8.81456C56.3735 8.81456 54.6651 10.3414 54.4319 11.9798H62.1984ZM66.3025 19.599C66.7528 20.0305 66.7337 20.7377 66.2601 21.1452C64.4297 22.7198 61.8593 23.579 59.3471 23.579C53.7162 23.579 49.4835 19.8553 49.4835 14.1957C49.4835 9.16832 53.056 4.77455 58.648 4.77455C63.8517 4.77455 67.5407 8.98227 67.5407 14.0091C67.5407 14.131 67.5381 14.2532 67.5332 14.374C67.5101 14.9415 67.0171 15.3869 66.425 15.3869H54.3764C54.6483 17.9188 56.7842 19.6692 59.4636 19.6692C61.1256 19.6692 62.5287 18.9701 63.4905 18.2215C63.9252 17.8831 64.5597 17.9277 64.9556 18.3075L66.3025 19.599ZM44.2522 5.40433L39.4131 15.8413L34.5743 5.40433C34.3965 5.0213 34.0032 4.77455 33.5696 4.77455H30.7926C29.9895 4.77455 29.4565 5.58086 29.7922 6.2878L37.3822 22.2859C37.5621 22.6645 37.9527 22.9074 38.3829 22.9074H40.4433C40.8735 22.9074 41.2644 22.6645 41.444 22.2859L49.0343 6.2878C49.3697 5.58086 48.8367 4.77455 48.0336 4.77455H45.2566C44.823 4.77455 44.4298 5.0213 44.2522 5.40433ZM24.5148 11.9798C24.3595 10.3787 22.8451 8.81456 20.7869 8.81456C18.6899 8.81456 16.9812 10.3414 16.7483 11.9798H24.5148ZM28.3505 19.3417C28.9651 19.931 28.9092 20.9013 28.2331 21.4255C26.4327 22.8215 24.0226 23.579 21.6632 23.579C16.0326 23.579 11.7999 19.8553 11.7999 14.1957C11.7999 9.16832 15.3724 4.77455 20.9644 4.77455C26.1678 4.77455 29.8571 8.98227 29.8571 14.0091C29.8571 14.131 29.8545 14.2532 29.8496 14.3743C29.8265 14.9415 29.3335 15.3869 28.7414 15.3869H16.6928C16.9647 17.9188 19.1003 19.6692 21.78 19.6692C23.3053 19.6692 24.613 19.0801 25.5612 18.4042C26.1528 17.9829 26.9701 18.018 27.4913 18.5179L28.3505 19.3417Z"/></svg>
    </a>
    <div class="hero-body">
      <p class="eyebrow"><i></i>Limited-time deals</p>
      <h1>Black<span>Friday</span></h1>
      <p class="lead">Choose your city and unlock the best Black Friday deals on experiences, concerts and shows.</p>
      <div class="suggest" id="suggest">
        <small>Near you</small>
        <a id="suggestLink" href="#"></a>
      </div>
    </div>
  </div>
</header>

<div class="tools" id="tools">
  <div class="container">
    <label class="field">
      <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" aria-hidden="true"><circle cx="11" cy="11" r="7"/><path d="m20 20-3.5-3.5"/></svg>
      <input id="q" type="search" placeholder="Search your city" autocomplete="off" enterkeyhint="go" aria-label="Search your city">
      <button class="clear" id="clear" type="button" aria-label="Clear search">&times;</button>
    </label>
    <div class="chips" id="chips" role="toolbar" aria-label="Filter by region"></div>
  </div>
</div>

<main class="container">
  <div id="list"></div>
  <div class="empty" id="empty">
    <p>We couldn't find that city.</p>
    <a class="btn" href="https://feverup.com/">Explore Fever</a>
  </div>
</main>

<footer>
  <div class="container">
    <span>&copy; 2026 Fever</span>
    <a href="https://feverup.com/">feverup.com</a>
  </div>
</footer>

<script>
/* ===== CONFIG ===== */
// Default UTMs for every WL link. utm_content is set per city.
// Any utm_* present on this page's URL (e.g. ?utm_source=instagram) overrides these.
const UTM = {
  utm_source: "linktree",
  utm_medium: "social",
  utm_campaign: "black_friday_2026_wl"
};

// Source: sheet "Black Friday Organization_2026" > tab "Black Friday - WL Plans".
// Mexico City has no ID in that tab; 142366 comes from tab "Black Friday - WL".
// [city, planId, timeZones used to suggest the city]
const REGIONS = [
  ["Spain", [
    ["Alicante",492860],["Barcelona",142766],["Bilbao",259144],["Madrid",142275,["Europe/Madrid"]],
    ["Majorca",260009],["Murcia",261722],["Seville",260010],["Valencia",260011],["Zaragoza",260012]]],
  ["UK & Ireland", [
    ["Birmingham",261719],["Dublin",142476,["Europe/Dublin"]],["Leeds",501772],["Liverpool",261718],
    ["London",142272,["Europe/London"]],["Manchester",142473]]],
  ["France", [
    ["Bordeaux",260008],["Lille",261730],["Lyon",259260],["Marseille",259261],["Nice",261729],
    ["Paris",142276,["Europe/Paris"]],["Strasbourg",261113],["Toulouse",259262]]],
  ["Germany & Austria", [
    ["Berlin",142421,["Europe/Berlin"]],["Dresden",492859],["Frankfurt",260013],["Hamburg",259010],
    ["Munich",259011],["Stuttgart",492855],["Vienna",143713,["Europe/Vienna"]]]],
  ["Rest of Europe", [
    ["Amsterdam",492844,["Europe/Amsterdam"]],["Brussels",142549,["Europe/Brussels"]],
    ["Geneva",261112,["Europe/Zurich"]],["Liège",261111],["Lisbon",259013,["Europe/Lisbon"]],
    ["Porto",259014],["Stockholm",492861,["Europe/Stockholm"]]]],
  ["United States", [
    ["Atlanta",142485],["Austin",142484],["Baltimore",144885],["Boston",142482],["Charleston",261717],
    ["Chicago",142479,["America/Chicago"]],["Cincinnati",260016],["Cleveland",260017],["Columbus",261711],
    ["Dallas",142478],["Denver",259076,["America/Denver"]],["Detroit",260018,["America/Detroit"]],
    ["Fort Lauderdale",144886],["Houston",142475],["Indianapolis",261715,["America/Indiana/Indianapolis"]],
    ["Jersey City",261716],["Kansas City",261710],["Los Angeles",142474,["America/Los_Angeles"]],
    ["Memphis",261712],["Miami",260019],["Minneapolis",261714],["Nashville",144887],
    ["New York",142469,["America/New_York"]],["Orlando",260020],["Philadelphia",260021],
    ["Phoenix",260022,["America/Phoenix"]],["Portland",142467],["Raleigh",143795],["Richmond",260023],
    ["Sacramento",143257],["Salt Lake City",142466],["San Antonio",144888],["San Diego",143258],
    ["San Francisco",142464],["San Jose",143259],["Santa Rosa",260024],["Seattle",142465],
    ["Tampa",260025],["Tucson",143796],["Tulsa",142461],["Washington DC",142460],["West Palm Beach",260026]]],
  ["Canada", [
    ["Edmonton",501765,["America/Edmonton"]],["Montreal",142548],["Toronto",142462,["America/Toronto"]],
    ["Vancouver",260028,["America/Vancouver"]]]],
  ["Latin America", [
    ["Bogotá",501763,["America/Bogota"]],["Mexico City",142366,["America/Mexico_City"]],
    ["Rio de Janeiro",142736],["Santiago",142550,["America/Santiago"]],
    ["São Paulo",142618,["America/Sao_Paulo"]]]],
  ["Asia-Pacific & Middle East", [
    ["Adelaide",142815,["Australia/Adelaide"]],["Brisbane",142481,["Australia/Brisbane"]],
    ["Dubai",142477,["Asia/Dubai"]],["Melbourne",142472,["Australia/Melbourne"]],
    ["Perth",263498,["Australia/Perth"]],["Singapore",142463,["Asia/Singapore"]],
    ["Sydney",259075,["Australia/Sydney"]]]]
];
/* ================== */

const norm = s => s.normalize("NFD").replace(/[̀-ͯ]/g, "").toLowerCase().trim();
const slug = s => norm(s).replace(/[^a-z0-9]+/g, "_").replace(/^_|_$/g, "");

const incoming = new URLSearchParams(location.search);
const utm = { ...UTM };
incoming.forEach((v, k) => { if (k.startsWith("utm_") && k !== "utm_content") utm[k] = v; });
const buildUrl = (id, city) =>
  `https://feverup.com/m/${id}?${new URLSearchParams({ ...utm, utm_content: slug(city) })}`;

const arrow = '<svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M5 12h14M13 6l6 6-6 6"/></svg>';

const list = document.getElementById("list");
const chips = document.getElementById("chips");
const q = document.getElementById("q");
const clear = document.getElementById("clear");
const empty = document.getElementById("empty");
let activeRegion = "All";

// City sections
REGIONS.forEach(([region, cities]) => {
  const sec = document.createElement("section");
  sec.dataset.region = region;
  const h2 = document.createElement("h2");
  h2.textContent = region;
  const grid = document.createElement("div");
  grid.className = "grid";
  cities.slice().sort((a, b) => a[0].localeCompare(b[0])).forEach(([city, id]) => {
    const a = document.createElement("a");
    a.className = "city";
    a.href = buildUrl(id, city);
    a.dataset.k = norm(city);
    a.innerHTML = `<span class="name"></span><span class="go">${arrow}</span>`;
    a.firstChild.textContent = city;
    grid.appendChild(a);
  });
  sec.append(h2, grid);
  list.appendChild(sec);
});

// Region chips
["All", ...REGIONS.map(r => r[0])].forEach(name => {
  const b = document.createElement("button");
  b.className = "chip";
  b.type = "button";
  b.textContent = name;
  b.setAttribute("aria-pressed", name === "All");
  b.onclick = () => {
    activeRegion = name;
    chips.querySelectorAll(".chip").forEach(c => c.setAttribute("aria-pressed", c === b));
    apply();
  };
  chips.appendChild(b);
});

function apply() {
  const term = norm(q.value);
  clear.style.display = term ? "block" : "none";
  let total = 0;
  list.querySelectorAll("section").forEach(sec => {
    // A search looks across all regions
    const regionOk = term || activeRegion === "All" || sec.dataset.region === activeRegion;
    let n = 0;
    sec.querySelectorAll(".city").forEach(a => {
      const show = regionOk && (!term || a.dataset.k.includes(term));
      a.style.display = show ? "" : "none";
      if (show) n++;
    });
    sec.style.display = n ? "" : "none";
    total += n;
  });
  empty.style.display = total ? "none" : "block";
}

q.addEventListener("input", apply);
q.addEventListener("keydown", e => {
  // Enter jumps to the first match
  if (e.key !== "Enter") return;
  const first = [...list.querySelectorAll(".city")].find(a => a.style.display !== "none");
  if (first && q.value.trim()) location.href = first.href;
});
clear.onclick = () => { q.value = ""; apply(); q.focus(); };

// Suggest a city from the device time zone
try {
  const tz = Intl.DateTimeFormat().resolvedOptions().timeZone;
  for (const [, cities] of REGIONS) {
    const hit = cities.find(c => (c[2] || []).includes(tz));
    if (hit) {
      const link = document.getElementById("suggestLink");
      link.href = buildUrl(hit[1], hit[0]);
      link.innerHTML = `<span></span>${arrow}`;
      link.firstChild.textContent = `See deals in ${hit[0]}`;
      document.getElementById("suggest").style.display = "block";
      break;
    }
  }
} catch (e) {}

// Divider under the sticky search once it's stuck
const tools = document.getElementById("tools");
new IntersectionObserver(([e]) => tools.classList.toggle("stuck", e.intersectionRatio < 1),
  { threshold: [1], rootMargin: "-1px 0px 0px 0px" }).observe(tools);
</script>
</body>
</html>
