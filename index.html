<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Fever Black Friday · Choose your city</title>
<meta name="description" content="Black Friday on Fever: pick your city and discover the best deals on experiences near you.">
<meta property="og:title" content="Fever Black Friday · Choose your city">
<meta property="og:description" content="Pick your city and discover the best Black Friday deals on experiences.">
<meta property="og:type" content="website">
<meta name="theme-color" content="#0b0b12">
<style>
  :root{
    --bg:#0b0b12; --surface:#15151f; --surface-2:#1d1d2a; --line:#2a2a3a;
    --text:#f5f5f7; --muted:#a0a0b4; --accent:#0079ff; --accent-2:#3d9bff; --hot:#ff3d6e;
    --radius:14px;
  }
  *{box-sizing:border-box}
  html,body{margin:0;background:var(--bg);color:var(--text);
    font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
    -webkit-font-smoothing:antialiased}
  a{color:inherit}
  .wrap{max-width:720px;margin:0 auto;padding:28px 16px 48px}
  header{text-align:center;padding:12px 0 20px}
  .brand{font-weight:800;letter-spacing:.02em;font-size:22px}
  .brand span{color:var(--accent)}
  .badge{display:inline-block;margin:14px 0 10px;padding:6px 12px;border-radius:999px;
    background:linear-gradient(90deg,var(--hot),#ff7a3d);font-weight:700;font-size:12px;
    letter-spacing:.12em;text-transform:uppercase}
  h1{font-size:clamp(28px,7vw,42px);line-height:1.05;margin:4px 0 10px;font-weight:800}
  .sub{color:var(--muted);margin:0 auto;max-width:440px;font-size:15px;line-height:1.45}

  .search{position:sticky;top:0;z-index:5;background:linear-gradient(var(--bg) 75%,transparent);
    padding:12px 0 14px}
  .search label{position:relative;display:block}
  .search svg{position:absolute;left:14px;top:50%;transform:translateY(-50%);color:var(--muted)}
  .search input{width:100%;padding:15px 16px 15px 44px;font-size:16px;color:var(--text);
    background:var(--surface);border:1px solid var(--line);border-radius:var(--radius);outline:none}
  .search input:focus{border-color:var(--accent)}
  .search input::placeholder{color:var(--muted)}

  .chips{display:flex;gap:8px;overflow-x:auto;padding:2px 0 8px;scrollbar-width:none}
  .chips::-webkit-scrollbar{display:none}
  .chip{flex:0 0 auto;padding:8px 12px;border-radius:999px;border:1px solid var(--line);
    background:var(--surface);color:var(--muted);font-size:13px;cursor:pointer;white-space:nowrap}
  .chip[aria-pressed="true"]{background:var(--accent);border-color:var(--accent);color:#fff}

  section{margin-top:22px}
  h2{font-size:13px;text-transform:uppercase;letter-spacing:.12em;color:var(--muted);
    margin:0 0 10px;font-weight:700}
  .grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}
  @media (min-width:560px){.grid{grid-template-columns:repeat(3,minmax(0,1fr))}}
  .city{display:flex;align-items:center;justify-content:space-between;gap:8px;
    padding:14px 14px;background:var(--surface);border:1px solid var(--line);
    border-radius:var(--radius);text-decoration:none;font-weight:600;font-size:15px;
    transition:background .15s,border-color .15s,transform .1s;min-height:52px}
  .city:hover,.city:focus-visible{background:var(--surface-2);border-color:var(--accent);outline:none}
  .city:active{transform:scale(.98)}
  .city .arr{color:var(--accent-2);flex:0 0 auto}
  .city .name{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  .empty{display:none;text-align:center;color:var(--muted);padding:36px 0}
  .empty a{color:var(--accent-2)}
  footer{margin-top:40px;text-align:center;color:var(--muted);font-size:12px}
  footer a{color:var(--muted)}
</style>
</head>
<body>
<div class="wrap">
  <header>
    <div class="brand">FEVER<span>.</span></div>
    <div class="badge">Black Friday</div>
    <h1>Choose your city</h1>
    <p class="sub">Unlock the best Black Friday deals on experiences near you.</p>
  </header>

  <div class="search">
    <label>
      <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><circle cx="11" cy="11" r="7"/><path d="m20 20-3.5-3.5"/></svg>
      <input id="q" type="search" placeholder="Search your city" autocomplete="off" aria-label="Search your city">
    </label>
  </div>
  <div class="chips" id="chips" role="toolbar" aria-label="Filter by region"></div>

  <main id="list"></main>
  <p class="empty" id="empty">We couldn't find that city.<br>
    <a href="https://feverup.com/">Explore all Fever cities</a></p>

  <footer>© Fever · <a href="https://feverup.com/">feverup.com</a></footer>
</div>

<script>
/* ===== CONFIG ===== */
// UTM parameters appended to every WL link. utm_content is set per city automatically.
const UTM = {
  utm_source: "linktree",
  utm_medium: "social",
  utm_campaign: "black_friday_2026_wl"
};

// Source: "Black Friday Organization_2026" > "Black Friday - WL Plans"
// [city, planId]
const REGIONS = [
  ["Spain", [
    ["Alicante",492860],["Barcelona",142766],["Bilbao",259144],["Madrid",142275],["Majorca",260009],
    ["Murcia",261722],["Seville",260010],["Valencia",260011],["Zaragoza",260012]]],
  ["UK & Ireland", [
    ["Birmingham",261719],["Dublin",142476],["Leeds",501772],["Liverpool",261718],["London",142272],
    ["Manchester",142473]]],
  ["France", [
    ["Bordeaux",260008],["Lille",261730],["Lyon",259260],["Marseille",259261],["Nice",261729],
    ["Paris",142276],["Strasbourg",261113],["Toulouse",259262]]],
  ["Germany & Austria", [
    ["Berlin",142421],["Dresden",492859],["Frankfurt",260013],["Hamburg",259010],["Munich",259011],
    ["Stuttgart",492855],["Vienna",143713]]],
  ["Rest of Europe", [
    ["Amsterdam",492844],["Brussels",142549],["Geneva",261112],["Liège",261111],["Lisbon",259013],
    ["Porto",259014],["Stockholm",492861]]],
  ["United States", [
    ["Atlanta",142485],["Austin",142484],["Baltimore",144885],["Boston",142482],["Charleston",261717],
    ["Chicago",142479],["Cincinnati",260016],["Cleveland",260017],["Columbus",261711],["Dallas",142478],
    ["Denver",259076],["Detroit",260018],["Fort Lauderdale",144886],["Houston",142475],
    ["Indianapolis",261715],["Jersey City",261716],["Kansas City",261710],["Los Angeles",142474],
    ["Memphis",261712],["Miami",260019],["Minneapolis",261714],["Nashville",144887],["New York",142469],
    ["Orlando",260020],["Philadelphia",260021],["Phoenix",260022],["Portland",142467],["Raleigh",143795],
    ["Richmond",260023],["Sacramento",143257],["Salt Lake City",142466],["San Antonio",144888],
    ["San Diego",143258],["San Francisco",142464],["San Jose",143259],["Santa Rosa",260024],
    ["Seattle",142465],["Tampa",260025],["Tucson",143796],["Tulsa",142461],["Washington DC",142460],
    ["West Palm Beach",260026]]],
  ["Canada", [
    ["Edmonton",501765],["Montreal",142548],["Toronto",142462],["Vancouver",260028]]],
  ["Latin America", [
    ["Bogotá",501763],["Mexico City",142366],["Rio de Janeiro",142736],["Santiago",142550],
    ["São Paulo",142618]]],
  ["Asia-Pacific & Middle East", [
    ["Adelaide",142815],["Brisbane",142481],["Dubai",142477],["Melbourne",142472],["Perth",263498],
    ["Singapore",142463],["Sydney",259075]]]
];
/* ================== */

const norm = s => s.normalize("NFD").replace(/[̀-ͯ]/g,"").toLowerCase().trim();
const slug = s => norm(s).replace(/[^a-z0-9]+/g,"_").replace(/^_|_$/g,"");
const buildUrl = (id, city) => {
  const p = new URLSearchParams({...UTM, utm_content: slug(city)});
  return `https://feverup.com/m/${id}?${p.toString()}`;
};
const arrow = '<svg class="arr" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" aria-hidden="true"><path d="M5 12h14M13 6l6 6-6 6"/></svg>';

const list = document.getElementById("list");
const chips = document.getElementById("chips");
const q = document.getElementById("q");
const empty = document.getElementById("empty");
let activeRegion = "All";

// Render sections
REGIONS.forEach(([region, cities]) => {
  const sec = document.createElement("section");
  sec.dataset.region = region;
  sec.innerHTML = `<h2>${region}</h2><div class="grid"></div>`;
  const grid = sec.querySelector(".grid");
  cities.slice().sort((a,b)=>a[0].localeCompare(b[0])).forEach(([city,id]) => {
    const a = document.createElement("a");
    a.className = "city";
    a.href = buildUrl(id, city);
    a.dataset.k = norm(city);
    a.innerHTML = `<span class="name">${city}</span>${arrow}`;
    grid.appendChild(a);
  });
  list.appendChild(sec);
});

// Region chips
["All", ...REGIONS.map(r=>r[0])].forEach(name => {
  const b = document.createElement("button");
  b.className = "chip"; b.type = "button"; b.textContent = name;
  b.setAttribute("aria-pressed", name==="All");
  b.onclick = () => {
    activeRegion = name;
    chips.querySelectorAll(".chip").forEach(c=>c.setAttribute("aria-pressed", c===b));
    apply();
  };
  chips.appendChild(b);
});

function apply(){
  const term = norm(q.value);
  let total = 0;
  list.querySelectorAll("section").forEach(sec => {
    const regionOk = activeRegion==="All" || sec.dataset.region===activeRegion || term;
    let n = 0;
    sec.querySelectorAll(".city").forEach(a => {
      const show = regionOk && (!term || a.dataset.k.includes(term));
      a.style.display = show ? "" : "none";
      if (show) n++;
    });
    sec.style.display = n ? "" : "none";
    total += n;
  });
  empty.style.display = total ? "none" : "block";
}
q.addEventListener("input", apply);
</script>
</body>
</html>
